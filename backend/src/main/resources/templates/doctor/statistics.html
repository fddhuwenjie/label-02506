<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('数据统计')}"></head>
<body>
<nav th:replace="~{fragments/layout :: doctor-sidebar('statistics')}"></nav>

<div class="main-content">
    <div class="top-bar">
        <h4 class="mb-0">数据统计</h4>
        <form class="d-flex gap-2" method="get">
            <input type="date" name="startDate" class="form-control" th:value="${startDate}" style="width:auto">
            <span class="align-self-center">至</span>
            <input type="date" name="endDate" class="form-control" th:value="${endDate}" style="width:auto">
            <button type="submit" class="btn btn-primary btn-sm">查询</button>
            <a th:href="@{/doctor/export/statistics(startDate=${startDate},endDate=${endDate})}" class="btn btn-success btn-sm">
                <i class="bi bi-download me-1"></i>导出Excel
            </a>
        </form>
    </div>
    
    <!-- 统计卡片 -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted mb-1">总挂号数</div>
                        <div class="value" th:text="${stats.totalRegistrations ?: 0}">0</div>
                    </div>
                    <div class="icon bg-primary bg-opacity-10 text-primary">
                        <i class="bi bi-calendar-check"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted mb-1">完成就诊</div>
                        <div class="value" th:text="${stats.completedVisits ?: 0}">0</div>
                    </div>
                    <div class="icon bg-success bg-opacity-10 text-success">
                        <i class="bi bi-check-circle"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted mb-1">总营收</div>
                        <div class="value">¥<span th:text="${stats.totalRevenue ?: 0}">0</span></div>
                    </div>
                    <div class="icon bg-warning bg-opacity-10 text-warning">
                        <i class="bi bi-currency-yen"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted mb-1">新增病人</div>
                        <div class="value" th:text="${stats.newPatients ?: 0}">0</div>
                    </div>
                    <div class="icon bg-info bg-opacity-10 text-info">
                        <i class="bi bi-person-plus"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <!-- 每日统计 -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0"><i class="bi bi-bar-chart me-2"></i>每日统计</h5>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>挂号数</th>
                                <th>就诊数</th>
                                <th>营收</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="stat : ${dailyStats}">
                                <td th:text="${stat.date}"></td>
                                <td th:text="${stat.registrations}"></td>
                                <td th:text="${stat.visits}"></td>
                                <td>¥<span th:text="${stat.revenue}"></span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- 药品销量TOP10 -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0"><i class="bi bi-capsule me-2"></i>药品销量TOP10</h5>
                </div>
                <div class="card-body p-0">
                    <table class="table table-sm mb-0">
                        <thead>
                            <tr>
                                <th>药品</th>
                                <th>数量</th>
                                <th>金额</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="med : ${topMedicines}">
                                <td th:text="${med.medicineName}"></td>
                                <td th:text="${med.totalQuantity}"></td>
                                <td>¥<span th:text="${med.totalAmount}"></span></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(topMedicines)}">
                                <td colspan="3" class="text-center text-muted py-3">暂无数据</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
