<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('挂号规则编辑')}"></head>
<body>
<nav th:replace="~{fragments/layout :: doctor-sidebar('rules')}"></nav>

<div class="main-content">
    <div class="top-bar">
        <h4 class="mb-0" th:text="${rule != null} ? '编辑挂号规则' : '新增挂号规则'"></h4>
        <a th:href="@{/doctor/rules}" class="btn btn-outline-secondary btn-sm">返回列表</a>
    </div>
    
    <div class="card">
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <form th:action="@{/doctor/rules/save}" method="post">
                <input type="hidden" name="id" th:value="${rule?.id}">
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">选择医生 <span class="text-danger">*</span></label>
                        <select name="doctorId" class="form-select" required>
                            <option value="">请选择医生</option>
                            <option th:each="doc : ${doctors}" th:value="${doc.id}" th:text="${doc.realName}"
                                    th:selected="${rule != null && rule.doctor.id == doc.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">星期 <span class="text-danger">*</span></label>
                        <select name="weekDay" class="form-select" required>
                            <option value="1" th:selected="${rule?.weekDay == 1}">周一</option>
                            <option value="2" th:selected="${rule?.weekDay == 2}">周二</option>
                            <option value="3" th:selected="${rule?.weekDay == 3}">周三</option>
                            <option value="4" th:selected="${rule?.weekDay == 4}">周四</option>
                            <option value="5" th:selected="${rule?.weekDay == 5}">周五</option>
                            <option value="6" th:selected="${rule?.weekDay == 6}">周六</option>
                            <option value="7" th:selected="${rule?.weekDay == 7}">周日</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">时段 <span class="text-danger">*</span></label>
                        <select name="timePeriod" class="form-select" required>
                            <option value="1" th:selected="${rule?.timePeriod == 1}">上午</option>
                            <option value="2" th:selected="${rule?.timePeriod == 2}">下午</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">最大挂号数 <span class="text-danger">*</span></label>
                        <input type="number" name="maxCount" class="form-control" required min="1" 
                               th:value="${rule?.maxCount ?: 20}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">开始时间 <span class="text-danger">*</span></label>
                        <input type="time" name="startTime" class="form-control" required 
                               th:value="${rule?.startTime ?: '08:00'}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">结束时间 <span class="text-danger">*</span></label>
                        <input type="time" name="endTime" class="form-control" required 
                               th:value="${rule?.endTime ?: '12:00'}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">挂号费（元） <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" name="fee" class="form-control" required min="0" 
                               th:value="${rule?.fee ?: 50}">
                    </div>
                </div>
                
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-1"></i>保存
                    </button>
                    <a th:href="@{/doctor/rules}" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
