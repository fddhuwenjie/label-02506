<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('药品编辑')}"></head>
<body>
<nav th:replace="~{fragments/layout :: doctor-sidebar('medicines')}"></nav>

<div class="main-content">
    <div class="top-bar">
        <h4 class="mb-0" th:text="${medicine != null} ? '编辑药品' : '新增药品'"></h4>
    </div>
    
    <div class="card">
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <form th:action="@{/doctor/medicines/save}" method="post" th:object="${medicine}">
                <input type="hidden" th:if="${medicine != null}" th:field="*{id}">
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">药品编码 <span class="text-danger">*</span></label>
                        <input type="text" name="medicineCode" class="form-control" required th:value="${medicine?.medicineCode}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">药品名称 <span class="text-danger">*</span></label>
                        <input type="text" name="medicineName" class="form-control" required th:value="${medicine?.medicineName}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">通用名</label>
                        <input type="text" name="genericName" class="form-control" th:value="${medicine?.genericName}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">规格</label>
                        <input type="text" name="specification" class="form-control" th:value="${medicine?.specification}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">单位 <span class="text-danger">*</span></label>
                        <input type="text" name="unit" class="form-control" required th:value="${medicine?.unit}" placeholder="盒/瓶/支">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">进价 <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" name="purchasePrice" class="form-control" required th:value="${medicine?.purchasePrice ?: 0}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">售价 <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" name="sellPrice" class="form-control" required th:value="${medicine?.sellPrice ?: 0}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">库存数量</label>
                        <input type="number" name="stockQuantity" class="form-control" th:value="${medicine?.stockQuantity ?: 0}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">预警数量</label>
                        <input type="number" name="warningQuantity" class="form-control" th:value="${medicine?.warningQuantity ?: 10}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">状态</label>
                        <select name="status" class="form-select">
                            <option value="1" th:selected="${medicine?.status == 1}">正常</option>
                            <option value="0" th:selected="${medicine?.status == 0}">停用</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">生产厂家</label>
                        <input type="text" name="manufacturer" class="form-control" th:value="${medicine?.manufacturer}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">药品分类</label>
                        <input type="text" name="category" class="form-control" th:value="${medicine?.category}">
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">用法用量</label>
                        <textarea name="usageMethod" class="form-control" rows="2" th:text="${medicine?.usageMethod}"></textarea>
                    </div>
                </div>
                
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-1"></i>保存
                    </button>
                    <a th:href="@{/doctor/medicines}" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
