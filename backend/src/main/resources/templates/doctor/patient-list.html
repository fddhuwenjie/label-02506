<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('病人档案')}"></head>
<body>
<nav th:replace="~{fragments/layout :: doctor-sidebar('patients')}"></nav>

<div class="main-content">
    <div class="top-bar">
        <h4 class="mb-0">病人档案管理</h4>
        <a th:href="@{/doctor/export/patients}" class="btn btn-success btn-sm">
            <i class="bi bi-download me-1"></i>导出Excel
        </a>
    </div>
    
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>姓名</th>
                        <th>手机号</th>
                        <th>注册时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="patient : ${patients}">
                        <td th:text="${patient.id}"></td>
                        <td th:text="${patient.realName}"></td>
                        <td th:text="${patient.phone ?: '-'}"></td>
                        <td th:text="${#temporals.format(patient.createTime, 'yyyy-MM-dd')}"></td>
                        <td>
                            <span th:if="${patient.status == 1}" class="badge bg-success">正常</span>
                            <span th:if="${patient.status != 1}" class="badge bg-secondary">禁用</span>
                        </td>
                        <td>
                            <a th:href="@{/doctor/patients/{id}(id=${patient.id})}" class="btn btn-sm btn-outline-primary">查看详情</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(patients)}">
                        <td colspan="6" class="text-center text-muted py-4">暂无病人数据</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
