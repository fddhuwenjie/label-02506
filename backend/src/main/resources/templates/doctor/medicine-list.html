<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('药品管理')}"></head>
<body>
<nav th:replace="~{fragments/layout :: doctor-sidebar('medicines')}"></nav>

<div class="main-content">
    <div class="top-bar">
        <h4 class="mb-0">药品管理</h4>
        <div>
            <span th:if="${lowStockCount > 0}" class="badge bg-warning me-2">
                <i class="bi bi-exclamation-triangle"></i> [[${lowStockCount}]]种药品库存不足
            </span>
            <a th:href="@{/doctor/medicines/add}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-circle me-1"></i>新增药品
            </a>
        </div>
    </div>
    
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>药品编码</th>
                        <th>药品名称</th>
                        <th>规格</th>
                        <th>单位</th>
                        <th>售价</th>
                        <th>库存</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="med : ${medicines}" th:classappend="${med.lowStock} ? 'table-warning'">
                        <td th:text="${med.medicineCode}"></td>
                        <td th:text="${med.medicineName}"></td>
                        <td th:text="${med.specification ?: '-'}"></td>
                        <td th:text="${med.unit}"></td>
                        <td>¥<span th:text="${med.sellPrice}"></span></td>
                        <td>
                            <span th:if="${med.lowStock}" class="text-danger fw-bold" th:text="${med.stockQuantity}"></span>
                            <span th:if="${!med.lowStock}" th:text="${med.stockQuantity}"></span>
                        </td>
                        <td>
                            <span th:if="${med.status == 1}" class="badge bg-success">正常</span>
                            <span th:if="${med.status != 1}" class="badge bg-secondary">停用</span>
                        </td>
                        <td>
                            <a th:href="@{/doctor/medicines/{id}/edit(id=${med.id})}" class="btn btn-sm btn-outline-primary">编辑</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(medicines)}">
                        <td colspan="8" class="text-center text-muted py-4">暂无药品数据</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
