<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('处方管理')}"></head>
<body>
<nav th:replace="~{fragments/layout :: doctor-sidebar('prescriptions')}"></nav>

<div class="main-content">
    <div class="top-bar">
        <h4 class="mb-0">处方管理</h4>
    </div>
    
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    
    <!-- 待审核处方 -->
    <div class="card mb-4" th:if="${!#lists.isEmpty(pendingList)}">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0"><i class="bi bi-clock-history text-warning me-2"></i>待审核处方</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>处方编号</th>
                        <th>病人</th>
                        <th>开方医生</th>
                        <th>诊断</th>
                        <th>金额</th>
                        <th>开方时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${pendingList}">
                        <td th:text="${p.prescriptionNo}"></td>
                        <td th:text="${p.patient.realName}"></td>
                        <td th:text="${p.doctor.realName}"></td>
                        <td th:text="${p.diagnosis ?: '-'}"></td>
                        <td>¥<span th:text="${p.totalAmount}"></span></td>
                        <td th:text="${#temporals.format(p.createTime, 'MM-dd HH:mm')}"></td>
                        <td>
                            <a th:href="@{/doctor/prescriptions/{id}(id=${p.id})}" class="btn btn-sm btn-primary">审核</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- 全部处方 -->
    <div class="card">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0"><i class="bi bi-prescription2 me-2"></i>全部处方</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>处方编号</th>
                        <th>病人</th>
                        <th>开方医生</th>
                        <th>金额</th>
                        <th>状态</th>
                        <th>开方时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${allList}">
                        <td th:text="${p.prescriptionNo}"></td>
                        <td th:text="${p.patient.realName}"></td>
                        <td th:text="${p.doctor.realName}"></td>
                        <td>¥<span th:text="${p.totalAmount}"></span></td>
                        <td>
                            <span class="badge" th:classappend="'badge-status-' + ${p.status}" th:text="${p.statusText}"></span>
                        </td>
                        <td th:text="${#temporals.format(p.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <a th:href="@{/doctor/prescriptions/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">详情</a>
                            <a th:href="@{/doctor/prescriptions/{id}/print(id=${p.id})}" class="btn btn-sm btn-outline-secondary" target="_blank">
                                <i class="bi bi-printer"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(allList)}">
                        <td colspan="7" class="text-center text-muted py-4">暂无处方记录</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
