<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - 门诊管理系统'">门诊管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { 
            --primary-color: #667eea; 
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --sidebar-width: 220px; 
        }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        /* 侧边栏 */
        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background: linear-gradient(180deg, #667eea 0%, #764ba2 100%); padding-top: 12px; z-index: 1000; }
        .sidebar .nav-link { color: rgba(255,255,255,0.85); padding: 12px 16px; margin: 4px 10px; border-radius: 10px; transition: all 0.2s; font-size: 14px; display: flex; align-items: center; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.2); color: white; }
        .sidebar .nav-link i { margin-right: 10px; font-size: 16px; }
        .sidebar .nav.flex-column { height: calc(100vh - 82px); }
        .main-content { margin-left: var(--sidebar-width); padding: 24px; min-height: 100vh; }
        .top-bar { background: white; padding: 18px 28px; margin: -24px -24px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8e8e8; }
        .top-bar h4 { font-weight: 600; color: #1a1a2e; }
        .logo { color: white; font-size: 20px; font-weight: bold; text-align: center; padding: 8px 16px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px; }
        
        /* 卡片 */
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); background: white; overflow: hidden; }
        .card-header { background: white; border-bottom: 1px solid #f0f0f0; padding: 16px 20px; font-weight: 600; }
        .card-body { padding: 20px; }
        .stat-card { padding: 24px; }
        .stat-card .icon { width: 56px; height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .stat-card .value { font-size: 32px; font-weight: 700; color: #1a1a2e; }
        .stat-card .text-muted { font-size: 13px; color: #6b7280 !important; }
        
        /* 表格样式优化 */
        .table { margin-bottom: 0; border-collapse: separate; border-spacing: 0; }
        .table thead th { 
            background: linear-gradient(180deg, #f8f9fc 0%, #f1f3f9 100%);
            border: none;
            border-bottom: 2px solid #e8e8e8;
            padding: 14px 16px;
            font-weight: 600;
            font-size: 13px;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            vertical-align: middle;
            white-space: nowrap;
        }
        .table tbody td {
            padding: 14px 16px;
            vertical-align: middle;
            border: none;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #4b5563;
        }
        .table tbody tr { transition: all 0.15s ease; }
        .table tbody tr:hover { background-color: #f8fafc; }
        .table tbody tr:last-child td { border-bottom: none; }
        .table-hover tbody tr:hover { background-color: rgba(102, 126, 234, 0.04); }
        
        /* 状态徽章 */
        .badge { 
            padding: 6px 12px; 
            font-size: 12px; 
            font-weight: 500; 
            border-radius: 6px;
            letter-spacing: 0.3px;
        }
        .badge-status-0 { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); color: white; }
        .badge-status-1 { background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%); color: white; }
        .badge-status-2 { background: linear-gradient(135deg, #34d399 0%, #10b981 100%); color: white; }
        .badge-status-3 { background: linear-gradient(135deg, #f87171 0%, #ef4444 100%); color: white; }
        .badge-status-4 { background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%); color: white; }
        
        /* 按钮优化 */
        .btn { 
            padding: 8px 16px; 
            font-size: 13px; 
            font-weight: 500; 
            border-radius: 8px; 
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-primary { 
            background: var(--primary-gradient); 
            border: none; 
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:hover { 
            transform: translateY(-1px); 
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
        .btn-success { 
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%); 
            border: none;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            background: linear-gradient(135deg, #22c55e 0%, #059669 100%);
            transform: translateY(-1px);
        }
        .btn-warning {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border: none;
            color: white;
        }
        .btn-danger {
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
            border: none;
        }
        .btn-outline-secondary {
            border: 1px solid #d1d5db;
            color: #6b7280;
        }
        .btn-outline-secondary:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
            color: #374151;
        }
        .btn-outline-warning {
            border: 1px solid #f59e0b;
            color: #d97706;
        }
        .btn-outline-warning:hover {
            background: #fffbeb;
        }
        .btn-outline-primary {
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            background: transparent;
        }
        .btn-outline-primary:hover {
            background: var(--primary-gradient);
            border-color: transparent;
            color: white;
        }
        .btn-outline-danger {
            border: 1px solid #ef4444;
            color: #dc2626;
        }
        .btn-outline-danger:hover {
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
            border-color: transparent;
            color: white;
        }
        .btn-outline-success {
            border: 1px solid #10b981;
            color: #059669;
        }
        .btn-outline-success:hover {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            border-color: transparent;
            color: white;
        }
        .btn-light {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: #374151;
        }
        .btn-light:hover {
            background: #e5e7eb;
            border-color: #d1d5db;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #9ca3af 0%, #6b7280 100%);
            border: none;
            color: white;
        }
        .btn-secondary:hover {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
        }
        .btn-info {
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            border: none;
            color: white;
        }
        .btn-info:hover {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
        }
        
        /* 列表组 */
        .list-group { border-radius: 12px; overflow: hidden; }
        .list-group-item {
            padding: 14px 18px;
            border: none;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s ease;
        }
        .list-group-item:last-child { border-bottom: none; }
        .list-group-item:hover { background-color: #f8fafc; }
        .list-group-flush > .list-group-item:first-child { border-top: none; }
        
        /* 表单优化 */
        .form-control, .form-select {
            padding: 10px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-label {
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
            font-size: 13px;
        }
        
        /* 提示框 */
        .alert {
            border: none;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        .alert-success {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            color: #065f46;
        }
        .alert-danger {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            color: #991b1b;
        }
        .alert-warning {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            color: #92400e;
        }
        .alert-info {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: #1e40af;
        }
        
        /* 模态框优化 */
        .modal-content {
            border: none;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .modal-header {
            border-bottom: 1px solid #f0f0f0;
            padding: 18px 24px;
        }
        .modal-title { font-weight: 600; }
        .modal-body { padding: 24px; }
        .modal-footer { border-top: 1px solid #f0f0f0; padding: 16px 24px; }
        
        /* 空状态 */
        .table tbody tr td[colspan] {
            padding: 40px 20px;
            color: #9ca3af;
        }
        
        /* 表格行状态 */
        .table tbody tr.table-warning {
            background-color: #fffbeb !important;
        }
        .table tbody tr.table-warning:hover {
            background-color: #fef3c7 !important;
        }
        .table tbody tr.table-success {
            background-color: #ecfdf5 !important;
        }
        .table tbody tr.table-danger {
            background-color: #fef2f2 !important;
        }
        
        /* 文本工具类增强 */
        .text-success { color: #059669 !important; }
        .text-danger { color: #dc2626 !important; }
        .text-warning { color: #d97706 !important; }
        .text-muted { color: #9ca3af !important; }
        .fw-bold { font-weight: 600 !important; }
        
        /* Badge 额外样式 */
        .bg-success { background: linear-gradient(135deg, #34d399 0%, #10b981 100%) !important; }
        .bg-secondary { background: linear-gradient(135deg, #9ca3af 0%, #6b7280 100%) !important; }
        .bg-warning { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%) !important; color: white !important; }
        .bg-danger { background: linear-gradient(135deg, #f87171 0%, #ef4444 100%) !important; }
        .bg-info { background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%) !important; }
        .bg-primary { background: var(--primary-gradient) !important; }
        .bg-info-subtle { background: #eff6ff !important; }
        .bg-opacity-10 { --bs-bg-opacity: 0.1 !important; }
        
        /* 卡片标题 */
        .card-header h5, .card-header h6 {
            margin: 0;
            font-weight: 600;
            color: #1a1a2e;
            display: flex;
            align-items: center;
        }
        .card-header h5 i, .card-header h6 i {
            font-size: 18px;
        }
        
        /* 统计卡片图标背景 */
        .stat-card .icon.bg-primary { background: rgba(102, 126, 234, 0.12) !important; }
        .stat-card .icon.bg-success { background: rgba(16, 185, 129, 0.12) !important; }
        .stat-card .icon.bg-warning { background: rgba(245, 158, 11, 0.12) !important; }
        .stat-card .icon.bg-info { background: rgba(14, 165, 233, 0.12) !important; }
        .stat-card .icon.bg-danger { background: rgba(239, 68, 68, 0.12) !important; }
        .stat-card .icon.text-primary { color: #667eea !important; }
        .stat-card .icon.text-success { color: #10b981 !important; }
        .stat-card .icon.text-warning { color: #f59e0b !important; }
        .stat-card .icon.text-info { color: #0ea5e9 !important; }
        .stat-card .icon.text-danger { color: #ef4444 !important; }
        
        /* 响应式表格 */
        @media (max-width: 768px) {
            .table thead th, .table tbody td {
                padding: 10px 12px;
                font-size: 13px;
            }
        }
        
        /* 输入组样式 */
        .input-group-text {
            background: #f8f9fc;
            border: 2px solid #e5e7eb;
            border-right: none;
            color: #6b7280;
        }
        .input-group .form-control {
            border-left: none;
        }
        .input-group:focus-within .input-group-text {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .input-group:focus-within .form-control {
            border-color: var(--primary-color);
        }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a1a1a1; }
    </style>
</head>

<th:block th:fragment="scripts">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function updateBeijingClock() {
    const clockEls = document.querySelectorAll('[data-beijing-clock]');
    if (!clockEls.length) return;
    const now = new Date();
    const formatted = new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
    }).format(now);
    clockEls.forEach(el => {
        el.textContent = '北京时间 ' + formatted;
    });
}
updateBeijingClock();
setInterval(updateBeijingClock, 1000);
</script>
</th:block>
