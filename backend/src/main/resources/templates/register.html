<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 门诊管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .bg-decoration {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            filter: blur(60px);
        }
        .bg-circle-1 {
            width: 500px; height: 500px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            top: -150px; left: -100px;
            animation: float1 20s ease-in-out infinite;
        }
        .bg-circle-2 {
            width: 400px; height: 400px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            bottom: -100px; right: -50px;
            animation: float2 25s ease-in-out infinite;
        }
        .bg-circle-3 {
            width: 300px; height: 300px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            top: 50%; left: 60%;
            animation: float3 18s ease-in-out infinite;
        }
        .bg-grid {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-40px, -50px) scale(1.15); }
        }
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(0.9); }
        }
        .medical-icons {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .medical-icon {
            position: absolute;
            color: rgba(255, 255, 255, 0.03);
            font-size: 80px;
        }
        .medical-icon:nth-child(1) { top: 10%; left: 5%; transform: rotate(-15deg); }
        .medical-icon:nth-child(2) { top: 60%; left: 8%; transform: rotate(10deg); }
        .medical-icon:nth-child(3) { top: 20%; right: 5%; transform: rotate(20deg); }
        .medical-icon:nth-child(4) { top: 70%; right: 10%; transform: rotate(-10deg); }
        .medical-icon:nth-child(5) { top: 40%; left: 3%; transform: rotate(5deg); }
        .medical-icon:nth-child(6) { bottom: 15%; right: 3%; transform: rotate(-20deg); }
        .register-wrapper {
            width: 100%;
            max-width: 460px;
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            z-index: 1;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .register-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 28px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-radius: 24px 24px 0 0;
        }
        .card-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            border-radius: 24px 24px 0 0;
        }
        .logo-icon {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 24px;
            color: white;
            position: relative;
        }
        .card-header h3 {
            color: white;
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            position: relative;
        }
        .card-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            margin: 6px 0 0;
            position: relative;
        }
        .card-body {
            padding: 28px;
        }
        .form-label {
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .input-group-text {
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            border-right: none;
            color: #6b7280;
            padding: 10px 14px;
        }
        .form-control {
            border: 2px solid #e5e7eb;
            border-left: none;
            padding: 10px 14px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: none;
        }
        .input-group:focus-within .input-group-text {
            border-color: #667eea;
            color: #667eea;
        }
        .input-group:focus-within .form-control {
            border-color: #667eea;
        }
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
        .btn-register:active {
            transform: translateY(0);
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #9ca3af;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        .divider span { padding: 0 16px; }
        .login-link {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }
        .login-link a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }
        .login-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .alert {
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .alert-danger {
            background: #fef2f2;
            color: #dc2626;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .text-danger { color: #dc2626 !important; }
    </style>
</head>
<body>
<div class="bg-decoration">
    <div class="bg-grid"></div>
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
</div>
<div class="medical-icons">
    <i class="bi bi-heart-pulse medical-icon"></i>
    <i class="bi bi-capsule medical-icon"></i>
    <i class="bi bi-bandaid medical-icon"></i>
    <i class="bi bi-clipboard2-pulse medical-icon"></i>
    <i class="bi bi-prescription2 medical-icon"></i>
    <i class="bi bi-hospital medical-icon"></i>
</div>
<div class="register-wrapper">
    <div class="register-card">
        <div class="card-header">
            <div class="logo-icon">
                <i class="bi bi-person-plus"></i>
            </div>
            <h3>病人注册</h3>
            <p>创建账号，开始使用门诊服务</p>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger">
                <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
            </div>

            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label class="form-label">用户名 <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" required placeholder="用于登录" autocomplete="username">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">真实姓名 <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <input type="text" name="realName" class="form-control" required placeholder="请输入真实姓名">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">手机号 <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-phone"></i></span>
                        <input type="tel" name="phone" class="form-control" required placeholder="请输入手机号" autocomplete="tel">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码 <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" required placeholder="至少6位" autocomplete="new-password">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">确认密码 <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="confirmPassword" class="form-control" required placeholder="再次输入密码" autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-register w-100">
                    <i class="bi bi-check-circle me-2"></i>立即注册
                </button>
            </form>

            <div class="divider"><span>或</span></div>

            <div class="login-link">
                已有账号？<a th:href="@{/login}">立即登录</a>
            </div>
        </div>
    </div>
    <div class="footer-text">
        © 2026 私立医院门诊管理系统
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
