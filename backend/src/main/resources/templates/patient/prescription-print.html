<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的处方</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "SimSun", serif; font-size: 14px; padding: 20px; }
        .prescription { max-width: 800px; margin: 0 auto; border: 2px solid #333; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header .subtitle { font-size: 18px; color: #666; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .info-item { flex: 1; }
        .info-item label { color: #666; }
        .divider { border-top: 1px dashed #999; margin: 15px 0; }
        .rx-symbol { font-size: 28px; font-weight: bold; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { border: 1px solid #999; padding: 8px; text-align: left; }
        th { background: #f5f5f5; }
        .total { text-align: right; font-size: 16px; font-weight: bold; margin: 15px 0; }
        .footer { margin-top: 30px; display: flex; justify-content: space-between; }
        .signature { width: 45%; }
        .signature p { margin-bottom: 30px; }
        .print-btn { position: fixed; top: 20px; right: 20px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .tips { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px; }
        .tips h4 { margin-bottom: 10px; font-size: 14px; }
        .tips ul { padding-left: 20px; font-size: 12px; color: #666; }
        @media print { .print-btn { display: none; } .tips { background: white; border: 1px solid #ddd; } }
    </style>
</head>
<body>
<button class="print-btn" onclick="window.print()">打印处方</button>

<div class="prescription">
    <div class="header">
        <h1>电子处方笺</h1>
        <p class="subtitle">ELECTRONIC PRESCRIPTION</p>
    </div>
    
    <div class="info-row">
        <div class="info-item">
            <label>处方编号：</label>
            <span th:text="${prescription.prescriptionNo}"></span>
        </div>
        <div class="info-item">
            <label>开方日期：</label>
            <span th:text="${#temporals.format(prescription.createTime, 'yyyy年MM月dd日')}"></span>
        </div>
    </div>
    
    <div class="info-row">
        <div class="info-item">
            <label>姓名：</label>
            <span th:text="${prescription.patient.realName}"></span>
        </div>
        <div class="info-item">
            <label>联系电话：</label>
            <span th:text="${prescription.patient.phone ?: '-'}"></span>
        </div>
    </div>
    
    <div class="divider"></div>
    
    <div class="info-row">
        <div class="info-item">
            <label>临床诊断：</label>
            <span th:text="${prescription.diagnosis ?: '-'}"></span>
        </div>
    </div>
    
    <div class="rx-symbol">Rp.</div>
    
    <table>
        <thead>
            <tr>
                <th style="width:30%">药品名称</th>
                <th style="width:15%">规格</th>
                <th style="width:10%">数量</th>
                <th style="width:10%">单价</th>
                <th style="width:35%">用法用量</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="d : ${prescription.details}">
                <td th:text="${d.medicineName}"></td>
                <td th:text="${d.specification ?: '-'}"></td>
                <td th:text="${d.quantity} + ${d.unit}"></td>
                <td>¥<span th:text="${d.unitPrice}"></span></td>
                <td th:text="${d.dosage} + '，' + ${d.frequency} + '，' + ${d.administration}"></td>
            </tr>
        </tbody>
    </table>
    
    <div class="total">
        处方金额：¥<span th:text="${prescription.totalAmount}"></span>
    </div>
    
    <div class="divider"></div>
    
    <div class="footer">
        <div class="signature">
            <p>开方医师：<span th:text="${prescription.doctor.realName}"></span></p>
            <p>审核药师：<span th:text="${prescription.auditDoctor?.realName ?: '________'}"></span></p>
        </div>
        <div class="signature">
            <p>发药状态：<span th:text="${prescription.statusText}"></span></p>
            <p th:if="${prescription.dispenseTime != null}">发药时间：<span th:text="${#temporals.format(prescription.dispenseTime, 'yyyy-MM-dd HH:mm')}"></span></p>
        </div>
    </div>
    
    <div class="tips">
        <h4>用药须知：</h4>
        <ul>
            <li>请严格按照医嘱服药，不要自行增减剂量</li>
            <li>如出现不良反应，请立即停药并就医</li>
            <li>药品请存放在阴凉干燥处，避免儿童接触</li>
            <li>本处方有效期为3天，过期请重新就诊</li>
        </ul>
    </div>
</div>
</body>
</html>
